services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_DB: mmop
      POSTGRES_USER: mmop
      POSTGRES_PASSWORD: mmop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmop -d mmop"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1::5432"
